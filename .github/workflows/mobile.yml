name: Build mobile assistants
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test shared extraction
        run: node --test mobile/shared/collect.test.mjs
      - name: Install build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' > /dev/null
      - name: Build, lint and sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          QUEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          export QUEST_KEYSTORE="$RUNNER_TEMP/quest-signing.p12"
          trap 'rm -f "$QUEST_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$QUEST_KEYSTORE"
          chmod 600 "$QUEST_KEYSTORE"
          cd mobile/android
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native WebView cookie extraction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd mobile/android
            gradle --no-daemon connectedDebugAndroidTest
            adb shell am start -W -n cn.badmintonquest.mobile/.MainActivity
            sleep 12
            adb exec-out screencap -p > app/build/phone-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quest-android
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/phone-preview.png
            mobile/android/app/build/reports/
          retention-days: 14
