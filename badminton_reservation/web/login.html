<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进入道馆 · 羽球训练家</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23cc4050'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/web.css"><script src="/auth.js" defer></script></head>
<body class="auth-page"><main class="auth-layout">
<section class="auth-story"><p class="auth-kicker">BADMINTON QUEST · WEB EDITION</p><h1>下一场，<br>随时出发。</h1><p>手机选场地，后台等开场。<br>你的预约计划，在自己的账号里井井有条。</p><div class="auth-gym" role="img" aria-label="像素风羽毛球馆"></div><div class="auth-features"><span>实时场地</span><span>定时预约</span><span>空位候补</span></div></section>
<section class="auth-card pixel-panel"><div class="auth-emblem">🏸</div><p class="auth-kicker">TRAINER PASS</p><h2 id="auth-title">欢迎回到道馆</h2><p class="auth-sub">先登录网站，再连接你自己的学校账号。</p>
<div class="auth-tabs" role="tablist" aria-label="网站账号"><button type="button" role="tab" aria-selected="true" data-mode="login">登录</button><button type="button" role="tab" aria-selected="false" data-mode="register">注册</button></div>
<form id="auth-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]+" placeholder="3–32 位字母、数字或下划线">
<label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="至少 10 个字符">
<div id="invite-row" hidden><label for="invite">注册邀请码</label><input id="invite" name="invite" autocomplete="off" placeholder="向网站部署者获取邀请码"></div>
<p id="auth-error" role="alert"></p><button class="button primary" id="auth-submit" type="submit">进入道馆 <span>›</span></button></form>
<p class="auth-foot">网站账号与学校账号分开管理。每个人拥有独立的任务、订单和学校登录会话。</p><p class="auth-foot">后台运行时，关闭网页不会停止已启用的任务；学校认证失效后仍可能需要重新登录。</p></section>
</main></body></html>
